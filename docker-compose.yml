version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: financeflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-financeflow_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeflow-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeflow-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-financeflow_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-SuperSecretProductionGradeKeyForJWTTokenSigning2026Secure}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      INGESTION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - financeflow-network

volumes:
  pgdata:
    driver: local

networks:
  financeflow-network:
    driver: bridge
